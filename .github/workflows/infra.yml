name: OmniProtect Infrastructure

on:
  push:
    branches: ["main"]
    paths:
      - "infra/terraform/**"
  pull_request:
    paths:
      - "infra/terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: ["plan", "apply", "destroy"]
        default: "plan"

permissions:
  contents: read
  id-token: write
  pull-requests: write   # to post plan output as PR comment

env:
  TF_DIR: infra/terraform/gcp
  WIF_PROVIDER: projects/830580686050/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SA: github-actions@omniprotect-prod.iam.gserviceaccount.com

jobs:
  terraform:
    name: "Terraform ${{ inputs.action || (github.event_name == 'pull_request' && 'plan') || 'plan' }}"
    runs-on: ubuntu-latest
    environment: ${{ (inputs.action == 'apply' || inputs.action == 'destroy') && 'production' || '' }}

    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
          echo "exitcode=$?" >> $GITHUB_OUTPUT

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_DIR }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: Terraform Apply
        if: |
          inputs.action == 'apply' ||
          (github.ref == 'refs/heads/main' && github.event_name == 'push')
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve
