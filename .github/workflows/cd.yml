name: OmniProtect CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GKE after build"
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

env:
  PROJECT_ID: omniprotect-prod
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPO: us-central1-docker.pkg.dev/omniprotect-prod/omniprotect
  WIF_PROVIDER: projects/830580686050/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SA: github-actions@omniprotect-prod.iam.gserviceaccount.com
  GKE_CLUSTER: omniprotect-prod
  GKE_ZONE: us-central1

# ── Stage 1: Build & Push ─────────────────────────────────────────────────────
jobs:
  build-push:
    name: "Build & Push Images"
    runs-on: ubuntu-latest

    outputs:
      api_image: ${{ steps.meta-api.outputs.tags }}
      console_image: ${{ steps.meta-console.outputs.tags }}
      sha_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud (OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── Platform API ────────────────────────────────────────────────────────
      - name: Extract API image metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REPO }}/platform-api
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push platform-api
        uses: docker/build-push-action@v6
        with:
          context: platform/api
          file: platform/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REPO }}/platform-api:buildcache
          cache-to: type=registry,ref=${{ env.REPO }}/platform-api:buildcache,mode=max

      # ── Console ─────────────────────────────────────────────────────────────
      - name: Extract console image metadata
        id: meta-console
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REPO }}/console
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push console
        uses: docker/build-push-action@v6
        with:
          context: platform/console
          file: platform/console/Dockerfile
          push: true
          tags: ${{ steps.meta-console.outputs.tags }}
          labels: ${{ steps.meta-console.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REPO }}/console:buildcache
          cache-to: type=registry,ref=${{ env.REPO }}/console:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_KEYCLOAK_URL=${{ vars.NEXT_PUBLIC_KEYCLOAK_URL }}
            NEXT_PUBLIC_KEYCLOAK_REALM=${{ vars.NEXT_PUBLIC_KEYCLOAK_REALM }}
            NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${{ vars.NEXT_PUBLIC_KEYCLOAK_CLIENT_ID }}

# ── Stage 2: Deploy to GKE ────────────────────────────────────────────────────
  deploy:
    name: "Deploy to GKE"
    runs-on: ubuntu-latest
    needs: build-push
    # Deploy on every main push, or when manually triggered with deploy=true
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.deploy == true)
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.16.0"

      - name: Resolve Helm dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build helm/openclaw

      - name: Apply Keycloak realm ConfigMap
        run: |
          kubectl create namespace omniprotect --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap keycloak-realm-import \
            --from-file=realm.json=platform/deployment/keycloak/realms/omniprotect-platform-realm.json \
            --namespace omniprotect \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Verify required secrets exist
        run: |
          kubectl get secret openclaw-secrets -n omniprotect || \
            { echo "ERROR: openclaw-secrets not found. Create DATABASE_URL, REDIS_URL, SECRET_KEY before deploying."; exit 1; }
          kubectl get secret keycloak-admin-secret -n omniprotect || \
            { echo "ERROR: keycloak-admin-secret not found."; \
              echo "Run: kubectl create secret generic keycloak-admin-secret --from-literal=admin-password='<password>' -n omniprotect"; \
              exit 1; }

      - name: Deploy via Helm
        run: |
          helm upgrade --install omniprotect helm/openclaw \
            --namespace omniprotect \
            --create-namespace \
            --atomic \
            --timeout 15m \
            --set platformApi.image.repository=${{ env.REPO }}/platform-api \
            --set platformApi.image.tag=${{ needs.build-push.outputs.sha_tag }} \
            --set console.image.repository=${{ env.REPO }}/console \
            --set console.image.tag=${{ needs.build-push.outputs.sha_tag }} \
            --values helm/openclaw/values.prod.yaml \
            --wait

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/omniprotect-openclaw-api -n omniprotect --timeout=5m
          kubectl rollout status deployment/omniprotect-openclaw-console -n omniprotect --timeout=5m
          kubectl rollout status deployment/omniprotect-openclaw-keycloak -n omniprotect --timeout=5m

      - name: Post deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| platform-api | \`${{ env.REPO }}/platform-api:${{ needs.build-push.outputs.sha_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| console | \`${{ env.REPO }}/console:${{ needs.build-push.outputs.sha_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://omniprotect.omnicybersolutions.com |" >> $GITHUB_STEP_SUMMARY
