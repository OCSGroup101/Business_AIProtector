# Production overrides for OmniProtect on GKE (omniprotect-prod)
# Applied on top of values.yaml by the CD pipeline.

# ── Disable bundled sub-charts (managed GCP services used instead) ────────────
postgresql:
  enabled: false
  external:
    host: "127.0.0.1"   # Cloud SQL Auth Proxy sidecar
    port: 5432

redis:
  enabled: false

kafka:
  enabled: false

minio:
  enabled: false

# ── Platform API ──────────────────────────────────────────────────────────────
platformApi:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# ── Console ───────────────────────────────────────────────────────────────────
console:
  replicaCount: 2

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: omniprotect.omnicybersolutions.com
      paths:
        - path: /auth
          pathType: Prefix
          service: keycloak
        - path: /api
          pathType: Prefix
          service: platform-api
        - path: /
          pathType: Prefix
          service: console
  tls:
    - secretName: omniprotect-tls
      hosts:
        - omniprotect.omnicybersolutions.com

# ── Keycloak ──────────────────────────────────────────────────────────────────
# Deployed via Bitnami sub-chart. Realm is imported on first start from the
# keycloak-realm-import ConfigMap created by the CD pipeline before helm upgrade.
# MSP admin users (glenn, brett, steve @omnicybersolutions.com) are included in
# the realm JSON with temporary passwords (force-change + TOTP on first login).
keycloak:
  enabled: true
  externalUrl: "https://omniprotect.omnicybersolutions.com/auth"
  externalRealmConfigMap: true   # disables chart-internal configmap-keycloak-realm.yaml
  fullnameOverride: omniprotect-openclaw-keycloak
  httpRelativePath: "/auth"
  auth:
    adminUser: admin
    existingSecret: keycloak-admin-secret
    passwordSecretKey: admin-password
  extraStartupArgs: "--import-realm"
  extraVolumes:
    - name: realm-config
      configMap:
        name: keycloak-realm-import
  extraVolumeMounts:
    - name: realm-config
      mountPath: /opt/bitnami/keycloak/data/import
  service:
    type: ClusterIP
    ports:
      http: 80
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
