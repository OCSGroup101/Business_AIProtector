# Production overrides for OmniProtect on GKE (omniprotect-prod)
# Applied on top of values.yaml by the CD pipeline.

# ── Disable bundled sub-charts (managed GCP services used instead) ────────────
postgresql:
  enabled: false
  external:
    host: "127.0.0.1"   # Cloud SQL Auth Proxy sidecar
    port: 5432

redis:
  enabled: false

kafka:
  enabled: false

minio:
  enabled: false

# ── Platform API ──────────────────────────────────────────────────────────────
platformApi:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# ── Console ───────────────────────────────────────────────────────────────────
console:
  replicaCount: 2

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: omniprotect.omnicybersolutions.com
      paths:
        - path: /api
          pathType: Prefix
          service: platform-api
        - path: /
          pathType: Prefix
          service: console
  tls:
    - secretName: omniprotect-tls
      hosts:
        - omniprotect.omnicybersolutions.com

# ── Keycloak ──────────────────────────────────────────────────────────────────
keycloak:
  externalUrl: "https://omniprotect.omnicybersolutions.com/auth"
