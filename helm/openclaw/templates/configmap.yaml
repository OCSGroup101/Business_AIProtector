apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openclaw.fullname" . }}-config
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
data:
  # Platform API connects to these internal service addresses
  DATABASE_HOST: {{ include "openclaw.fullname" . }}-postgresql
  DATABASE_PORT: "5432"
  DATABASE_NAME: openclaw
  REDIS_URL: redis://{{ include "openclaw.fullname" . }}-redis-master:6379
  KAFKA_BROKERS: {{ include "openclaw.fullname" . }}-kafka:9092
  MINIO_ENDPOINT: {{ include "openclaw.fullname" . }}-minio:9000
  MINIO_BUCKET: openclaw
  {{- if .Values.keycloak.externalUrl }}
  KEYCLOAK_URL: {{ .Values.keycloak.externalUrl }}
  {{- end }}
