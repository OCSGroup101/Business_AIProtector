{{- if .Values.platformApi.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "openclaw.fullname" . }}-api
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "openclaw.fullname" . }}-api
  minReplicas: {{ .Values.platformApi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.platformApi.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.platformApi.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
