[package]
name = "openclaw-rdk"
version = "0.1.0"
edition = "2021"
authors = ["Omni Cyber Solutions LLC <dev@omnicybersolutions.com>"]
license = "Apache-2.0"
description = "OpenClaw Rule Development Kit — validate, test, and lint detection rules"
repository = "https://github.com/OCSGroup101/Business_AIProtector"
rust-version = "1.77"

[[bin]]
name = "openclaw-rdk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.10"

# Reuse rule types from the agent library
openclaw-agent = { path = "../agent" }
